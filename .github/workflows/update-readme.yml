
name: Update Profile README

on:
  # Run every day at 14:17 UTC.
  schedule:
    - cron: "17 14 * * *"

  # Allow manual runs from the Actions tab.
  workflow_dispatch:

  # Refresh after changing the configuration or updater.
  push:
    paths:
      - "current_project.json"
      - "scripts/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README sections
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md; then
            echo "README has no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "chore: update profile README"
          git push
